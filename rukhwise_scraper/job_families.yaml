# Rukhwise job-family taxonomy -- controlled vocabulary for title
# normalization (see job_family_classifier.py). This is a FIXED starter
# list approved by hand, not emergent from clustering: extend it
# deliberately, by editing this file after reviewing a gap report, never
# by letting the classifier invent new families.
#
# Each family's `keywords` are TITLE phrases only (unlike domains.yaml,
# which also carries broader description-topic words) -- job titles are
# short and conventional, so a compact set of exact phrasings is the
# right shape here. Matched as whole words/phrases, case-insensitive,
# same convention as taxonomy_v3.yaml's aliases. Seniority prefixes
# (senior, junior, lead, assistant, head of, chief) are stripped from the
# START of a title before matching -- see job_family_classifier.py's
# _strip_seniority_prefix() -- so "Assistant Accountant" matches
# `accountant` while "Executive Assistant" (where "assistant" is the role
# itself, not a leading modifier) is untouched, since the strip only ever
# removes a LEADING token.
#
# `domain` scopes a family to one of domains.yaml's keys, letting stage 1
# search that domain's families first (a posting's domain narrows the
# candidate family list enormously) before falling back to an unscoped
# search across every family. `domain: cross_domain` marks a family that
# legitimately appears across many domains (e.g. "Intern") and is always
# included in the domain-scoped search regardless of which domain a
# posting was assigned, on top of being found by the unscoped fallback.

