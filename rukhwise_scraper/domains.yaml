# Rukhwise domain taxonomy -- controlled vocabulary for posting-level
# domain classification (see domain_classifier.py). This is a FIXED list,
# not emergent from data: extend it deliberately, by editing this file,
# not by letting the classifier invent new buckets.
#
# Each domain's `keywords` list is used by BOTH rule stages: stage 1
# (title, first match by count wins) and stage 2 (description, weighted
# by count with a margin requirement over the runner-up). Keywords are
# matched as whole words/phrases, case-insensitive, same convention as
# taxonomy_v2.yaml's skill aliases -- a phrase must appear as a standalone
# token sequence, not a substring inside another word.
#
# Each list mixes two registers deliberately: compact JOB-TITLE phrases
# ("warehouse manager") that fire cleanly on stage 1's short title text,
# and broader TOPIC words ("warehouse", "logistics") that fire on stage
# 2's longer, more discursive description text ("warehouse management",
# "logistics coordination" -- different grammatical forms of the same
# topic that the title-phrase alone would miss). Order matters only as a
# human-readable grouping; it has no effect on matching (stage 1/2 always
# rank by count, never by list position).
#
# customer_support_bpo and construction_realestate are called out
# explicitly here because they were the two largest gaps in the prior
# title-only, four-source inference: both are large Pakistani employment
# sectors the old vocabulary collapsed into other_unclassified.

