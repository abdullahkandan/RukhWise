# Rukhwise skill taxonomy v3 -- built from taxonomy_v2.yaml exactly per
# output/taxonomy_v3_approved.md's line-by-line ruling. taxonomy_v1.yaml and
# taxonomy_v2.yaml are left in place, untouched, as the historical record
# extraction_method='taxonomy_v1'/'taxonomy_v2' rows were computed against.
#
# v3 adds 7 new categories (health_clinical, lab_science, safety_compliance,
# supply_chain, electrical_mechanical, teaching, customer_service) plus
# substantive/non-substantive additions to existing categories, sourced from
# taxonomy_v3_consolidate.py's merged tag+text discovery passes and ruled on
# by hand in taxonomy_v3_approved.md. One v2 entry (customer_service) was
# RELOCATED from category 'soft' to the new 'customer_service' category --
# same key, same aliases, corrected classification (see that entry's comment).
#
# Rukhwise skill taxonomy v2 (superseded)
#
# Extends v1 (96 skills, 11 categories) with requirement_type, a second
# axis alongside category: skill | credential | experience | language |
# attribute. All 96 v1 entries are requirement_type: skill, unchanged
# otherwise -- taxonomy_v1.yaml is left in place, untouched, as the
# historical record extraction_method='taxonomy_v1' rows were computed
# against (see output/taxonomy_v2_spec.md).
#
# Credentials (degree level/field, certification) and experience
# (min/max years, level) are DELIBERATELY NOT taxonomy entries here --
# they are structured columns on postings, extracted by
# structured_extraction.py. "Bachelor's" / "bachelor's degree" / "bachelor's
# degree in computer" are one fact about a posting, not three taxonomy
# hits; "3 years" / "2-3 years" are the same field at different values,
# and an n-gram-shaped taxonomy entry can't carry range semantics. Only
# language and attribute (work_arrangement) are new taxonomy entries.
#
# 96 canonical skills across 11 categories. Aliases are matched as whole
# words/phrases (see extract_skills.py) against posting title + description
# + skills_raw text -- casing doesn't matter, but the phrase must appear as
# a standalone token sequence, not as a substring inside another word.
#
# `signal` on a category is a downstream hint for consumers of extracted
# skills, not something extract_skills.py itself uses: soft skills are
# near-universal in job postings (almost every listing says "communication"
# somewhere) and carry weak differentiation value on their own, so they're
# marked `low`. Everything else is `normal`.

categories:
  programming: {signal: normal}
  analytics_bi: {signal: normal}
  data_ml: {signal: normal}
  marketing_tech: {signal: normal}
  web_ecommerce: {signal: normal}
  enterprise_erp: {signal: normal}
  cloud_devops: {signal: normal}
  design: {signal: normal}
  accounting_finance: {signal: normal}
  office_admin: {signal: normal}
  soft: {signal: low}
  language: {signal: normal}
  work_arrangement: {signal: normal}
  health_clinical: {signal: normal}
  lab_science: {signal: normal}
  safety_compliance: {signal: normal}
  supply_chain: {signal: normal}
  electrical_mechanical: {signal: normal}
  teaching: {signal: normal}
  customer_service: {signal: normal}

