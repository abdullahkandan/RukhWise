# Rukhwise skill taxonomy v1
#
# 96 canonical skills across 11 categories. Aliases are matched as whole
# words/phrases (see extract_skills.py) against posting title + description
# + skills_raw text -- casing doesn't matter, but the phrase must appear as
# a standalone token sequence, not as a substring inside another word.
#
# `signal` on a category is a downstream hint for consumers of extracted
# skills, not something extract_skills.py itself uses: soft skills are
# near-universal in job postings (almost every listing says "communication"
# somewhere) and carry weak differentiation value on their own, so they're
# marked `low`. Everything else is `normal`.

categories:
  programming: {signal: normal}
  analytics_bi: {signal: normal}
  data_ml: {signal: normal}
  marketing_tech: {signal: normal}
  web_ecommerce: {signal: normal}
  enterprise_erp: {signal: normal}
  cloud_devops: {signal: normal}
  design: {signal: normal}
  accounting_finance: {signal: normal}
  office_admin: {signal: normal}
  soft: {signal: low}

skills:

  # ---------- programming (12) ----------
  python:
    display: Python
    category: programming
    aliases: [python, python3, "python 3"]
  sql:
    display: SQL
    category: programming
    aliases: [sql, t-sql, tsql, pl/sql, plsql, mysql, postgresql, postgres, "sql server", "ms sql", "ms sql server"]
  javascript:
    display: JavaScript
    category: programming
    aliases: [javascript, "java script", js, ecmascript]
  java:
    display: Java
    category: programming
    aliases: [java, "core java"]
  php:
    display: PHP
    category: programming
    aliases: [php]
  "c++":
    display: C++
    category: programming
    aliases: ["c++", cpp, "c/c++"]
  "c#":
    display: C#
    category: programming
    aliases: ["c#", csharp, "c sharp"]
  r:
    display: R
    category: programming
    # Bare "r" was dropped after extraction testing: every match in the
    # real corpus (6/6) came from "R&D" or a company name ("R&B Logistics"),
    # not the R language -- the token-boundary regex worked exactly as
    # designed (isolated token, not a substring), but "R&D" is genuinely
    # indistinguishable from "R" the language by token shape alone. Keeping
    # only qualified aliases avoids that 100%-false-positive case.
    aliases: ["r programming", "r language", rstudio, "r studio"]
  typescript:
    display: TypeScript
    category: programming
    aliases: [typescript, ts]
  html_css:
