name: Collect Mustakbil Postings

on:
  schedule:
    # 03:00 UTC = 08:00 PKT, daily
    - cron: "0 3 * * *"
  workflow_dispatch: {}

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: pip install -r requirements.txt

      # Every step below also runs skill extraction (taxonomy_v3) automatically
      # for the postings it touches -- collect.py calls extract.run_extraction()
      # after upsert+enrichment, scoped to that run's scrape_run_id. No separate
      # extraction step is needed here; --enrich-all / extract.py --all are
      # one-time backfill commands run manually, not part of the schedule.
      #
      # Domain/job-family classification is deliberately NOT run here -- it
      # depends on Groq, and this workflow must stay dependency-free on
      # everything except the job boards themselves. See the separate
      # .github/workflows/classify.yml, on its own daily schedule.
      - name: Run Mustakbil collection (general feed)
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: python collect.py --source mustakbil --category all --pages 10

      - name: Run Mustakbil collection (IT category)
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: python collect.py --source mustakbil --category it --pages 10

      # Indeed via JobSpy. Not yet proven to survive GitHub's datacenter IPs
      # (Indeed can and does block/rate-limit non-residential ranges) --
      # continue-on-error so a block here shows up loudly as a failed step
      # in the run log without taking down Mustakbil's already-succeeded
      # collection. Trust the schedule only after a workflow_dispatch run
      # confirms real rows land, not just a clean exit.
      - name: Run Indeed collection (JobSpy)
        continue-on-error: true
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: python collect.py --source indeed

      # LinkedIn via JobSpy -- same "not yet proven to survive GitHub's
      # datacenter IPs" situation Indeed was in before its own first
      # workflow_dispatch confirmed real rows landed. Two streams
      # (results_wanted=50 each, see jobspy_source.py's LINKEDIN_STREAMS),
      # 30s slept between them, then the existing mandatory geo-filter and
      # staleness handling -- unchanged. continue-on-error so a block or
      # rate-limit here never fails collection; collect.py's own log ends
      # with an explicit PASS/FAIL verdict guide (requested vs received
      # per stream, any 429s, inserted count) so one workflow_dispatch run
      # is judgeable without cross-referencing anything else.
      - name: Run LinkedIn collection (JobSpy)
        continue-on-error: true
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: python collect.py --source linkedin
